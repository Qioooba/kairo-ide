# Kairo IDE — Dependabot Configuration
#
# Automatically keeps dependencies up to date with regular PRs.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ─── Go dependencies (runtime-agent) ─────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/runtime-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "go"
    assignees:
      - "kairo-team"
    reviewers:
      - "kairo-team"
    # Group minor and patch updates together
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "go"
      include: "scope"

  # ─── npm/pnpm dependencies ──────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "kairo-team"
    reviewers:
      - "kairo-team"
    # Group TypeScript, ESLint, and Playwright updates
    groups:
      typescript-eslint:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "eslint"
          - "prettier"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
          - "@axe-core/*"
      theia:
        patterns:
          - "@theia/*"
      electron:
        patterns:
          - "electron"
          - "electron-builder"
    open-pull-requests-limit: 10
    # Ignore major version bumps for Theia and Electron (tested manually)
    ignore:
      - dependency-name: "@theia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "npm"
      include: "scope"

  # ─── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "kairo-team"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"