name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # 1. Go unit + integration tests on every platform.
  # -----------------------------------------------------------------------
  go-test:
    name: Go unit & integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true
          cache-dependency-path: runtime-agent/go.sum
      - name: Test (unit)
        working-directory: runtime-agent
        run: GOTOOLCHAIN=local go test -race -timeout 120s ./...
      - name: Build all targets
        working-directory: runtime-agent
        run: |
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              ext=""; [ "$goos" = "windows" ] && ext=".exe"
              echo "  building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
                GOTOOLCHAIN=local \
                go build -trimpath -ldflags='-s -w' \
                -o bin/kairo-runtime-$goos-$goarch$ext ./cmd/kairo-runtime
            done
          done

  go-integration:
    name: Go integration (JDK present, Linux)
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Integration tests
        working-directory: runtime-agent
        run: GOTOOLCHAIN=local go test -race -tags=integration -timeout 240s ./test/integration/...

  # -----------------------------------------------------------------------
  # 2. TypeScript packages + apps build. Includes the real Theia build,
  #    not just typecheck.
  # -----------------------------------------------------------------------
  ts-build:
    name: TypeScript packages + Theia build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install (frozen lockfile, ignore native scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Typecheck apps
        run: pnpm -r --filter './apps/*' exec tsc -p tsconfig.json --noEmit
      - name: Real Theia browser build
        run: pnpm --filter @kairo/browser exec theia build --mode production

  # -----------------------------------------------------------------------
  # 3. legacy-sample smoke against the real agent. Uses real javac,
  #    real TOMCAT 6, and asserts HTTP responses.
  # -----------------------------------------------------------------------
  legacy-sample-smoke:
    name: legacy-sample smoke (Linux)
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install + build (TS)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter './packages/*' build
      - name: Cache Tomcat 6
        id: tomcat
        uses: actions/cache@v4
        with:
          path: /tmp/kairo-tomcat6
          key: tomcat6-18099-${{ hashFiles('scripts/fetch-tomcat6.sh') }}
      - name: Fetch Tomcat 6.0.53
        if: steps.tomcat.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tomcat6.sh /tmp/kairo-tomcat6
      - name: Run end-to-end smoke
        env:
          KAIRO_TOMCAT6_HOME: /tmp/kairo-tomcat6/apache-tomcat-6.0.53
        run: bash scripts/verify-e2e.sh 18099

  # -----------------------------------------------------------------------
  # 4. Theia Browser UI smoke (Playwright). Boots the full stack,
  #    opens the browser, asserts the Kairo commands and views are
  #    registered. Runs only on Linux because Playwright headless
  #    shells are easier to manage there.
  # -----------------------------------------------------------------------
  theia-browser-ui:
    name: Theia Browser UI smoke
    runs-on: ubuntu-latest
    needs: [go-test, ts-build, legacy-sample-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install (ignore native scripts; we use the stub drivelist)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Tomcat 6
        id: tomcat
        uses: actions/cache@v4
        with:
          path: /tmp/kairo-tomcat6
          key: tomcat6-18099-${{ hashFiles('scripts/fetch-tomcat6.sh') }}
      - name: Fetch Tomcat 6
        if: steps.tomcat.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tomcat6.sh /tmp/kairo-tomcat6
      - name: Boot Runtime Agent
        working-directory: runtime-agent
        env:
          KAIRO_TOMCAT6_HOME: /tmp/kairo-tomcat6/apache-tomcat-6.0.53
        run: |
          go build -o bin/kairo-runtime ./cmd/kairo-runtime
          mkdir -p /tmp/kairo-data
          ./bin/kairo-runtime --bind 127.0.0.1 --port 18099 --data-dir /tmp/kairo-data --log-level info &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:18099/api/v1/health && break
            sleep 0.25
          done
      - name: Boot Theia
        run: |
          pnpm --filter @kairo/browser exec theia start legacy-sample --hostname=127.0.0.1 --port=3000 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 0.5
          done
      - name: Run Playwright UI E2E
        run: node tests/e2e/theia-smoke.cjs http://127.0.0.1:3000 18099
      - name: Upload Theia screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theia-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # 5. Windows verifier. Runs the same end-to-end as Linux but
  #    exercises Windows process kill, paths, and PowerShell.
  # -----------------------------------------------------------------------
  windows-e2e:
    name: Windows e2e (PowerShell)
    runs-on: windows-latest
    needs: [go-test, ts-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install + build
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter './packages/*' build
          cd runtime-agent
          go build -trimpath -ldflags='-s -w' -o bin/kairo-runtime.exe ./cmd/kairo-runtime
      - name: Cache Tomcat 6
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\tools\tomcat6" | Out-Null
      - name: Fetch Tomcat 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\tools\tomcat6\apache-tomcat-6.0.53")) {
            bash scripts/fetch-tomcat6.sh "C:\tools\tomcat6"
          }
        env:
          # Avoid interactive prompts
          DEBIAN_FRONTEND: noninteractive
      - name: Run end-to-end smoke
        shell: pwsh
        env:
          KAIRO_TOMCAT6_HOME: C:\tools\tomcat6\apache-tomcat-6.0.53
        run: |
          $env:KAIRO_TOMCAT6_HOME = "C:\tools\tomcat6\apache-tomcat-6.0.53"
          powershell -ExecutionPolicy Bypass -File scripts/verify-e2e.ps1 -Port 18099 -TomcatPort 61100 -RepoRoot "$env:GITHUB_WORKSPACE"
