name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: only the contents: read needed for actions/checkout.
# Without this block GitHub Actions implicitly grants a per-job GITHUB_TOKEN
# with broad write scopes (deployments, statuses, packages) — a compromised
# dependency could push artifacts under this repo's identity.
permissions:
  contents: read

jobs:
  go-test:
    name: Go unit & integration
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in sync with runtime-agent/go.mod's `go` directive
          # and the `toolchain` line. Previously this was '1.23.0'
          # here and '1.22' in legacy-sample-smoke — diverging from
          # go.mod's `1.23` requirement.
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: runtime-agent/go.sum
      - name: Test
        working-directory: runtime-agent
        run: GOTOOLCHAIN=local go test -race -timeout 120s ./...
      - name: Build all targets
        working-directory: runtime-agent
        if: matrix.os == 'ubuntu-latest'
        run: |
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              ext=""
              [ "$goos" = "windows" ] && ext=".exe"
              echo "  building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
                GOTOOLCHAIN=local \
                go build -trimpath -ldflags='-s -w' \
                -o bin/kairo-runtime-$goos-$goarch$ext ./cmd/kairo-runtime
            done
          done

  go-integration:
    name: Go integration (JDK present)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Integration tests
        working-directory: runtime-agent
        run: GOTOOLCHAIN=local go test -race -tags=integration -timeout 240s ./test/integration/...

  ts-build:
    name: TypeScript packages
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        # --frozen-lockfile enforces that pnpm-lock.yaml is in sync
        # with package.json. The previous `--frozen-lockfile=false`
        # silently rewrote the lockfile on every CI run, masking
        # un-committed dependency changes.
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Typecheck apps
        run: pnpm -r --filter './apps/*' exec tsc -p tsconfig.json --noEmit

  legacy-sample-smoke:
    name: legacy-sample smoke
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Was '1.22', diverging from go.mod's `1.23`. Use the
          # same version as the rest of the Go jobs.
          go-version: '1.23.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Boot agent
        working-directory: runtime-agent
        run: |
          go build -o bin/kairo-runtime ./cmd/kairo-runtime
          mkdir -p /tmp/kairo-smoke
          ./bin/kairo-runtime --bind 127.0.0.1 --port 18099 --data-dir /tmp/kairo-smoke &
          sleep 2
      - name: Verify health
        run: |
          curl -fsS http://127.0.0.1:18099/api/v1/health
      - name: Search across legacy-sample
        run: |
          curl -fsS -X POST http://127.0.0.1:18099/api/v1/search \
            -H "Content-Type: application/json" \
            -d "{\"requestId\":\"smoke-1\",\"payload\":{\"query\":\"\u4f60\u597d\",\"workspaceId\":\"$PWD/legacy-sample\"}}" \
            | tee /tmp/search.out
          grep -q "\u4f60\u597d" /tmp/search.out
      - name: Encoding detect on the GBK JSP
        run: |
          curl -fsS -X POST http://127.0.0.1:18099/api/v1/encoding/detect \
            -H "Content-Type: application/json" \
            -d "{\"requestId\":\"smoke-2\",\"payload\":{\"file\":\"$PWD/legacy-sample/WebRoot/hello.jsp\"}}"
          echo
      - name: Real javac compile via /api/v1/builds
        run: |
          curl -fsS -X POST http://127.0.0.1:18099/api/v1/builds \
            -H "Content-Type: application/json" \
            -d "{\"requestId\":\"smoke-3\",\"payload\":{\"projectRoot\":\"$PWD/legacy-sample\",\"sourceLevel\":\"1.6\",\"targetLevel\":\"1.6\"}}"
          echo
