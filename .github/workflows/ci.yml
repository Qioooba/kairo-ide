name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Least-privilege: only the contents: read needed for actions/checkout.
# Without this block GitHub Actions implicitly grants a per-job GITHUB_TOKEN
# with broad write scopes (deployments, statuses, packages) — a compromised
# dependency could push artifacts under this repo's identity.
permissions:
  contents: read

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # 1. Go unit tests on every platform. The JDT LS installer +
  #    frame bridge are package-level unit tests; the same
  #    source compiles + runs on Linux, macOS, and Windows.
  # -----------------------------------------------------------------------
  go-test:
    name: Go unit tests (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in sync with runtime-agent/go.mod's `go` directive
          # and the `toolchain` line.
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: runtime-agent/go.sum
      - name: Test (unit, with -race)
        working-directory: runtime-agent
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: sum.golang.org https://goproxy.cn/sumdb/sum.golang.org
        run: GOTOOLCHAIN=local go test -race -timeout 180s ./...
      - name: Build all targets
        working-directory: runtime-agent
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              ext=""; [ "$goos" = "windows" ] && ext=".exe"
              echo "  building $goos/$goarch"
              GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
                GOTOOLCHAIN=local \
                go build -trimpath -ldflags='-s -w' \
                -o bin/kairo-runtime-$goos-$goarch$ext ./cmd/kairo-runtime
            done
          done

  go-integration:
    name: Go integration (JDK present)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Integration tests
        working-directory: runtime-agent
        env:
          KAIRO_LEGACY_SAMPLE: ${{ github.workspace }}/legacy-sample
        run: GOTOOLCHAIN=local go test -race -tags=integration -timeout 240s ./test/integration/...

  # -----------------------------------------------------------------------
  # 2. TypeScript packages + apps build + Runtime Client + encoding
  #    + command registration unit tests. Linux.
  # -----------------------------------------------------------------------
  ts-build:
    name: TypeScript packages + Theia build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install (frozen lockfile, ignore native scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Typecheck apps
        run: pnpm -r --filter './apps/*' exec tsc -p tsconfig.json --noEmit
      - name: Real Theia browser production build
        run: pnpm --filter @kairo/browser exec theia build --mode production
      - name: Runtime Client unit tests (14 base + 24 dynamic routes)
        run: pnpm --filter @kairo/runtime-extension exec node --test src/browser/runtime.test.cjs src/browser/runtime-dynamic-routes.test.cjs
      - name: Encoding service unit tests
        run: pnpm --filter @kairo/encoding-extension exec node --test src/browser/encoding-service.test.cjs
      - name: Kairo command registration regression test
        run: pnpm --filter @kairo/theia-product exec node --test src/main/browser/kairo-commands.test.cjs

  # -----------------------------------------------------------------------
  # 2b. TypeScript package-level tests (pnpm test). Linux.
  # -----------------------------------------------------------------------
  ts-test:
    name: TypeScript package tests (Linux)
    runs-on: ubuntu-latest
    needs: ts-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install (frozen lockfile, ignore native scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Run package tests
        run: pnpm -r --filter './packages/*' test

  # -----------------------------------------------------------------------
  # 2c. Contract tests — requires Go Agent + Theia running together.
  #     Stub: not yet implemented in CI; run locally with the full stack.
  # -----------------------------------------------------------------------
  contract-test:
    name: Contract tests (stub)
    runs-on: ubuntu-latest
    needs: [go-test, ts-build]
    steps:
      - name: Contract tests require Go Agent + Theia running
        run: |
          echo "Contract tests require Go Agent + Theia running together."
          echo "Run locally: start the agent and Theia, then execute the contract test suite."
          echo "CI integration blocked on: reproducible agent + Theia co-boot orchestration."

  # -----------------------------------------------------------------------
  # 3. legacy-sample smoke against the real agent. Uses real javac,
  #    real TOMCAT 6, and asserts HTTP responses. Linux.
  # -----------------------------------------------------------------------
  legacy-sample-smoke:
    name: legacy-sample smoke (Linux)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install + build (TS)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter './packages/*' build
      - name: Cache Tomcat 6
        id: tomcat
        uses: actions/cache@v4
        with:
          path: /tmp/kairo-tomcat6
          key: tomcat6-18099-${{ hashFiles('scripts/fetch-tomcat6.sh') }}
      - name: Fetch Tomcat 6.0.53
        if: steps.tomcat.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tomcat6.sh /tmp/kairo-tomcat6
      - name: Run end-to-end smoke
        env:
          KAIRO_TOMCAT6_HOME: /tmp/kairo-tomcat6/apache-tomcat-6.0.53
        run: bash scripts/verify-e2e.sh 18099
      - name: Upload agent + tomcat logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-sample-smoke-logs
          path: |
            /tmp/kairo-tomcat6/apache-tomcat-6.0.53/logs/
            /tmp/kairo-e2e-*/agent.log
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # 4. Theia Browser UI full-chain (Playwright). Boots the full
  #    stack and exercises the real IDE loop: open workspace,
  #    open a .java file, trigger completion, F12, build,
  #    deploy, start, open application, GBK JSP round-trip.
  #    Linux because Playwright headless is easiest here.
  # -----------------------------------------------------------------------
  theia-browser-ui:
    name: Theia Browser UI full-chain
    runs-on: ubuntu-latest
    needs: [go-test, ts-build, legacy-sample-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install (ignore native scripts; we use the stub drivelist)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Tomcat 6
        id: tomcat
        uses: actions/cache@v4
        with:
          path: /tmp/kairo-tomcat6
          key: tomcat6-18099-${{ hashFiles('scripts/fetch-tomcat6.sh') }}
      - name: Fetch Tomcat 6
        if: steps.tomcat.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tomcat6.sh /tmp/kairo-tomcat6
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Boot Runtime Agent
        working-directory: runtime-agent
        env:
          KAIRO_TOMCAT6_HOME: /tmp/kairo-tomcat6/apache-tomcat-6.0.53
        run: |
          go build -o bin/kairo-runtime ./cmd/kairo-runtime
          mkdir -p /tmp/kairo-data
          ./bin/kairo-runtime --bind 127.0.0.1 --port 18099 --data-dir /tmp/kairo-data --log-level info > /tmp/agent.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:18099/api/v1/health && break
            sleep 0.25
          done
      - name: Boot Theia
        run: |
          pnpm --filter @kairo/browser exec theia start legacy-sample --hostname=127.0.0.1 --port=3000 > /tmp/theia.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 0.5
          done
      - name: Run Playwright UI full-chain
        run: node tests/e2e/ui-full-chain.cjs http://127.0.0.1:3000 18099
      - name: Upload Theia screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theia-ui-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload Theia + agent logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theia-ui-logs
          path: |
            /tmp/agent.log
            /tmp/theia.log
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # 5. Windows e2e — PowerShell verify-e2e.ps1 with the new
  #    --data-dir flag (which is now a real agent flag, not
  #    silently ignored). Windows process kill, paths, etc.
  # -----------------------------------------------------------------------
  windows-e2e:
    name: Windows e2e (PowerShell)
    runs-on: windows-latest
    needs: [go-test, ts-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install + build
        shell: pwsh
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter './packages/*' build
          cd runtime-agent
          go build -trimpath -ldflags='-s -w' -o bin/kairo-runtime.exe ./cmd/kairo-runtime
      - name: Cache Tomcat 6
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\tools\tomcat6" | Out-Null
      - name: Fetch Tomcat 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\tools\tomcat6\apache-tomcat-6.0.53")) {
            bash scripts/fetch-tomcat6.sh "C:\tools\tomcat6"
          }
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Run end-to-end smoke
        shell: pwsh
        env:
          KAIRO_TOMCAT6_HOME: C:\tools\tomcat6\apache-tomcat-6.0.53
        run: |
          $env:KAIRO_TOMCAT6_HOME = "C:\tools\tomcat6\apache-tomcat-6.0.53"
          powershell -ExecutionPolicy Bypass -File scripts/verify-e2e.ps1 -Port 18099 -TomcatPort 61100 -RepoRoot "$env:GITHUB_WORKSPACE"

  # -----------------------------------------------------------------------
  # 6. macOS build + JDT LS installer + project generator. macOS
  #    has no JDT LS binary fetch in CI; the test imports a
  #    synthetic archive via KAIRO_JDTLS_ARCHIVE so the network
  #    is not touched.
  # -----------------------------------------------------------------------
  macos-build:
    name: macOS build + JDT LS installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
      - name: Build macOS agent
        working-directory: runtime-agent
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' \
            -o bin/kairo-runtime-darwin-arm64 ./cmd/kairo-runtime
      - name: Verify config flags
        working-directory: runtime-agent
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -count=1 -run 'TestBind_' ./internal/config/... -v
      - name: Verify jdtls installer + project generator
        working-directory: runtime-agent
        env:
          GOPROXY: https://goproxy.cn,direct
        run: go test -count=1 -v ./internal/jdtls/... ./internal/jdtproject/... ./internal/api/...
