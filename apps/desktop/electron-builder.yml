appId: com.kairo.ide
productName: Kairo IDE
copyright: Copyright © 2025-2026 Kairo IDE

directories:
  output: dist
  buildResources: resources

# Do NOT rebuild native modules; we ship zero native Node addons.
npmRebuild: false

# Include all compiled artifacts produced by `pnpm build`.
# Layout after copy:
#   lib/main.js          — desktop main process
#   lib/preload.js       — contextBridge preload
#   lib/frontend/**/*    — Theia frontend (copied from apps/browser)
#   lib/backend/**/*     — Theia backend (copied from apps/browser)
#   bundled/**/*         — JDT LS + Tomcat 6 (copied from project root)
files:
  - lib/main.js
  - lib/preload.js
  - lib/process-manager.js
  - lib/jdk-check.js
  - lib/frontend/**/*
  - lib/backend/**/*
  - package.json
  # Exclude source maps — production builds don't need them (~133 MB saved).
  - "!lib/**/*.map"
  # Exclude test files from the production package.
  - "!lib/**/*.test.js"
  # Node_modules are controlled by the dependencies field in package.json.
  # Only @kairo/protocol is listed as a runtime dependency; all other packages
  # are in devDependencies so electron-builder won't include them.
asar: true
asarUnpack:
  - lib/backend/native/**/*

# Platform-specific agent binary. The desktop prebuild script
# produces the binary under runtime-agent/bin/. electron-builder
# copies it into the platform-specific resources folder so the
# main process can resolve it at runtime via process.resourcesPath.
# The binary name is platform-specific (kairo-runtime vs kairo-runtime.exe),
# so extraResources is configured per-platform below.

# macOS
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  extraResources:
    - from: ../../runtime-agent/bin/kairo-runtime
      to: bin/kairo-runtime

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${name}-${version}-win-${arch}.${ext}
  extraResources:
    - from: ../../runtime-agent/bin/kairo-runtime.exe
      to: bin/kairo-runtime.exe
    - from: bundled/tomcat6
      to: bundled/tomcat6
      filter: ["**/*"]
    - from: bundled/jdtls
      to: bundled/jdtls
      filter: ["**/*"]
    - from: bundled/kairo-jdi-bridge.jar
      to: bundled/kairo-jdi-bridge.jar
  sign: scripts/sign-win.cjs
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Support paths with spaces and Chinese characters.
  unicode: true
  # Installer icon
  installerIcon: resources/icon.ico
  # Uninstaller icon
  uninstallerIcon: resources/icon.ico
  # Installer header image
  installerHeaderIcon: resources/icon.ico
  # Create desktop shortcut
  createDesktopShortcut: true
  # Create start menu shortcut
  createStartMenuShortcut: true
  # Shortcut name
  shortcutName: Kairo IDE
  # Include JDT LS and Tomcat in the installer
  include: scripts/installer/kairo-setup.nsi
  # Run after install
  runAfterFinish: false
  # Delete app data on uninstall prompt
  deleteAppDataOnUninstall: true

# Linux
linux:
  target:
    - AppImage
    - zip
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  extraResources:
    - from: ../../runtime-agent/bin/kairo-runtime
      to: bin/kairo-runtime
  category: Development
  synopsis: Kairo IDE — Legacy Java Web IDE
  description: A cross-platform IDE for legacy Java Web projects (JDK 1.6 / Tomcat 6 / JSP / Servlet / GBK).

# Publish configuration (optional, for auto-update)
publish: null