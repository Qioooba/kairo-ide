# Properties files are read as ISO-8859-1 by ResourceBundle on
# JDK <= 8 (and by Properties.load on every JDK). The previous
# file stored "你好" as raw UTF-8 bytes, which the loader decoded
# as ISO-8859-1 garbage. Using \uXXXX escapes keeps the file pure
# ASCII and works on every JDK without a custom PropertyResourceBundle
# reader or -Dfile.encoding=UTF-8.
greeting=\u4f60\u597d\uff0c\u6b22\u8fce\u4f7f\u7528 Kairo IDE
