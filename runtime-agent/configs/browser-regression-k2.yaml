# Browser Regression test config for K2.7 isolated run.
# Frontend:  3098 (Theia Browser)
# Agent:     18183 (Runtime Agent)
# Tomcat:    8098
# Debug:     9556

version: 0.1.0

bindAddress: 127.0.0.1
port: 18183

tlsCert: ""
tlsKey: ""

dataDir: /Users/qi/Documents/spaces/kairo-ide/.runtime-k2/data
bundledDir: /Users/qi/Documents/spaces/kairo-ide/.runtime-k2/bundled

logLevel: info

requireAuth: false

tomcatStartTimeout: 60s
