<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kairo IDE Theme Test - IDEA Dark vs Kairo Dark (VSCode)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1f22; color: #A9B7C6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 10px; }
  h1 { text-align: center; font-size: 18px; margin-bottom: 8px; color: #CC7832; }
  .container { display: flex; gap: 10px; height: calc(100vh - 80px); }
  .editor-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid #3d4148; border-radius: 4px; overflow: hidden; }
  .panel-title { padding: 6px 10px; font-size: 13px; font-weight: bold; text-align: center; }
  .vscode-title { background: #252629; color: #c586c0; border-bottom: 1px solid #3d4148; }
  .idea-title { background: #252629; color: #CC7832; border-bottom: 1px solid #3d4148; }
  .editor { flex: 1; min-height: 0; }
  .file-tabs { display: flex; background: #252629; border-bottom: 1px solid #3d4148; }
  .file-tab { padding: 4px 12px; font-size: 12px; cursor: pointer; color: #a9adb3; border-right: 1px solid #3d4148; }
  .file-tab.active { color: #dfe1e5; background: #1e1f22; }
  #results { margin-top: 10px; padding: 10px; background: #252629; border-radius: 4px; font-size: 12px; max-height: 150px; overflow-y: auto; }
  .color-swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #555; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .token-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .token-name { width: 120px; font-family: monospace; color: #6897BB; }
  .token-text { font-family: monospace; flex: 1; }
  .pass { color: #6A8759; font-weight: bold; }
  .fail { color: #CC7832; font-weight: bold; }
</style>
</head>
<body>
<h1>Kairo IDE Syntax Highlighting: IDEA Darcula Dark vs Kairo Dark (VSCode-style)</h1>
<div class="container">
  <div class="editor-panel">
    <div class="panel-title vscode-title">Kairo Dark (VSCode-style) - Current</div>
    <div class="file-tabs" id="tabs-vscode">
      <div class="file-tab active" data-file="java">HelloServlet.java</div>
      <div class="file-tab" data-file="jsp">index.jsp</div>
    </div>
    <div id="editor-vscode" class="editor"></div>
  </div>
  <div class="editor-panel">
    <div class="panel-title idea-title">Kairo IDEA Dark (IntelliJ Darcula)</div>
    <div class="file-tabs" id="tabs-idea">
      <div class="file-tab active" data-file="java">HelloServlet.java</div>
      <div class="file-tab" data-file="jsp">index.jsp</div>
    </div>
    <div id="editor-idea" class="editor"></div>
  </div>
</div>
<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
const JAVA_CODE = `package com.example.legacy;

import java.io.IOException;
import java.util.Date;
import javax.servlet.ServletException;
import javax.servlet.http.HttpServlet;
import javax.servlet.http.HttpServletRequest;
import javax.servlet.http.HttpServletResponse;

/**
 * HelloServlet - the canonical first Servlet.
 * A test class for IDEA theme verification.
 */
public class HelloServlet extends HttpServlet {

    private static final long serialVersionUID = 1L;
    public static final String GREETING = "Hello";
    private int count = 42;

    @Override
    protected void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws ServletException, IOException {
        String name = req.getParameter("name");
        if (name == null || name.isEmpty()) {
            name = "world";
        }
        resp.setContentType("text/html; charset=GBK");
        resp.getWriter().println("<!doctype html>");
        resp.getWriter().println("<html><body>");
        resp.getWriter().println("<h1>\\u4f60\\u597d, " + name + "</h1>");
        resp.getWriter().println("<p>It is now " + new Date() + "</p>");
        resp.getWriter().println("</body></html>");
        // Single line comment
        double pi = 3.14159;
        boolean flag = true;
    }
}`;

const JSP_CODE = `<%@ page language="java" contentType="text/html; charset=GBK" %>
<%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>
<%-- JSP comment --%>
<!-- HTML comment -->
<html>
<head>
    <title>\${greeting} Test Page</title>
    <style>
        body { font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <h1>Hello, \${name}!</h1>
    <%
        String message = "Welcome to Kairo IDE";
        int count = 100;
        for (int i = 0; i < count; i++) {
            out.println("<p>Item " + i + "</p>");
        }
    %>
    <c:if test="\${not empty name}">
        <p>Welcome, \${name}!</p>
    </c:if>
    <form action="hello" method="post">
        <input type="text" name="name" value="world"/>
        <input type="submit" value="Say Hello"/>
    </form>
</body>
</html>`;

const KAIRO_DARK_THEME = {
    base: 'vs-dark',
    inherit: true,
    rules: [
        { token: 'comment', foreground: '7a7e85', fontStyle: 'italic' },
        { token: 'keyword', foreground: 'c586c0' },
        { token: 'string', foreground: 'ce9178' },
        { token: 'number', foreground: 'b5cea8' },
        { token: 'type', foreground: '4ec9b0' },
        { token: 'identifier', foreground: 'dfe1e5' },
        { token: 'delimiter', foreground: 'a9adb3' },
        { token: 'tag', foreground: '569cd6' },
        { token: 'attribute.name', foreground: '9cdcfe' },
        { token: 'attribute.value', foreground: 'ce9178' },
    ],
    colors: {
        'editor.background': '#1e1f22',
        'editor.foreground': '#dfe1e5',
        'editor.lineHighlightBackground': '#252629',
        'editorLineNumber.foreground': '#5d6166',
        'editorLineNumber.activeForeground': '#c5c8cc',
        'editorCursor.foreground': '#c8a8ff',
        'editor.selectionBackground': '#7C3AED55',
    }
};

const KAIRO_IDEA_THEME = {
    base: 'vs-dark',
    inherit: true,
    rules: [
        { token: 'comment', foreground: '808080' },
        { token: 'comment.doc', foreground: '629755' },
        { token: 'keyword', foreground: 'CC7832' },
        { token: 'string', foreground: '6A8759' },
        { token: 'string.quote', foreground: '6A8759' },
        { token: 'string.escape', foreground: 'CC7832' },
        { token: 'number', foreground: '6897BB' },
        { token: 'number.float', foreground: '6897BB' },
        { token: 'number.hex', foreground: '6897BB' },
        { token: 'type', foreground: 'A9B7C6' },
        { token: 'type.identifier', foreground: 'A9B7C6' },
        { token: 'identifier', foreground: 'A9B7C6' },
        { token: 'constant', foreground: 'CC7832' },
        { token: 'constant.language', foreground: 'CC7832' },
        { token: 'constant.character', foreground: '6A8759' },
        { token: 'annotation', foreground: 'BBB529' },
        { token: 'delimiter', foreground: 'A9B7C6' },
        { token: 'delimiter.angle', foreground: 'E8BF6A' },
        { token: 'delimiter.bracket', foreground: 'A9B7C6' },
        { token: 'delimiter.square', foreground: 'A9B7C6' },
        { token: 'delimiter.parenthesis', foreground: 'A9B7C6' },
        { token: 'delimiter.curly', foreground: 'A9B7C6' },
        { token: 'delimiter.html', foreground: 'E8BF6A' },
        { token: 'operator', foreground: 'A9B7C6' },
        { token: 'support', foreground: 'A9B7C6' },
        { token: 'support.class', foreground: 'A9B7C6' },
        { token: 'support.type', foreground: 'A9B7C6' },
        { token: 'support.function', foreground: 'A9B7C6' },
        { token: 'predefined', foreground: 'A9B7C6' },
        { token: 'tag', foreground: 'E8BF6A' },
        { token: 'tag.jsp-directive', foreground: 'E8BF6A' },
        { token: 'tag.jsp-decl', foreground: 'E8BF6A' },
        { token: 'tag.jsp-expr', foreground: 'E8BF6A' },
        { token: 'tag.jsp-scriptlet', foreground: 'E8BF6A' },
        { token: 'tag.jsp-jstl', foreground: 'E8BF6A' },
        { token: 'tag.jsp-taglib', foreground: 'E8BF6A' },
        { token: 'metatag', foreground: '808080' },
        { token: 'metatag.delimiter', foreground: 'E8BF6A' },
        { token: 'metatag.el', foreground: '6897BB' },
        { token: 'attribute.name', foreground: 'BABABA' },
        { token: 'attribute.value', foreground: '6A8759' },
    ],
    colors: {
        'editor.background': '#1e1f22',
        'editor.foreground': '#A9B7C6',
        'editor.lineHighlightBackground': '#252629',
        'editorLineNumber.foreground': '#5d6166',
        'editorLineNumber.activeForeground': '#c5c8cc',
        'editorCursor.foreground': '#c8a8ff',
        'editor.selectionBackground': '#7C3AED55',
        'editorBracketPairGuide.activeBackground1': '#A9B7C600',
        'editorBracketPairGuide.activeBackground2': '#A9B7C600',
        'editorBracketPairGuide.background1': '#A9B7C600',
        'editorBracketPairGuide.background2': '#A9B7C600',
    }
};

function rgbToHex(rgb) {
    if (!rgb) return null;
    const m = rgb.match(/(\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return rgb;
    return '#' + [m[1], m[2], m[3]].map(n => parseInt(n).toString(16).padStart(2, '0')).join('').toUpperCase();
}

require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });

let vscodeEditor, ideaEditor;
let currentFile = 'java';

require(['vs/editor/editor.main'], function() {
    monaco.editor.defineTheme('kairo-dark-test', KAIRO_DARK_THEME);
    monaco.editor.defineTheme('kairo-idea-dark-test', KAIRO_IDEA_THEME);

    vscodeEditor = monaco.editor.create(document.getElementById('editor-vscode'), {
        value: JAVA_CODE,
        language: 'java',
        theme: 'kairo-dark-test',
        fontSize: 13,
        lineNumbers: 'on',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        fontFamily: 'Menlo, Monaco, Consolas, monospace',
        bracketPairColorization: { enabled: false },
        guides: { bracketPairs: false },
    });

    ideaEditor = monaco.editor.create(document.getElementById('editor-idea'), {
        value: JAVA_CODE,
        language: 'java',
        theme: 'kairo-idea-dark-test',
        fontSize: 13,
        lineNumbers: 'on',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        fontFamily: 'Menlo, Monaco, Consolas, monospace',
        bracketPairColorization: { enabled: false },
        guides: { bracketPairs: false },
    });

    function switchFile(file) {
        currentFile = file;
        const code = file === 'java' ? JAVA_CODE : JSP_CODE;
        const lang = file === 'java' ? 'java' : 'html';
        vscodeEditor.setValue(code);
        monaco.editor.setModelLanguage(vscodeEditor.getModel(), lang);
        ideaEditor.setValue(code);
        monaco.editor.setModelLanguage(ideaEditor.getModel(), lang);
        document.querySelectorAll('#tabs-vscode .file-tab, #tabs-idea .file-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.file === file);
        });
        setTimeout(verifyColors, 500);
    }

    document.querySelectorAll('.file-tab').forEach(tab => {
        tab.addEventListener('click', () => switchFile(tab.dataset.file));
    });

    setTimeout(verifyColors, 800);
});

function verifyColors() {
    const results = document.getElementById('results');
    results.innerHTML = '<strong>Color Verification (IDEA Dark Theme):</strong><br>';
    const editorEl = document.getElementById('editor-idea');
    const spans = editorEl.querySelectorAll('span[class*="mtk"]');
    const tokenMap = {};
    spans.forEach(s => {
        if (!s.textContent.trim()) return;
        const cls = Array.from(s.classList).find(c => c.startsWith('mtk'));
        if (!cls) return;
        const hex = rgbToHex(window.getComputedStyle(s).color);
        if (!tokenMap[cls]) {
            tokenMap[cls] = { color: hex, samples: [] };
        }
        if (tokenMap[cls].samples.length < 5) {
            tokenMap[cls].samples.push(s.textContent.trim().substring(0, 20));
        }
    });

    results.innerHTML += '<div style="margin-top:6px"><strong>Detected token colors in IDEA editor:</strong></div>';
    for (const [cls, info] of Object.entries(tokenMap)) {
        results.innerHTML += '<div class="token-row"><span class="token-name">' + cls + '</span><span class="color-swatch" style="background:' + info.color + '"></span><span style="font-family:monospace;color:' + info.color + '">' + info.color + '</span><span class="token-text">' + info.samples.join(' | ') + '</span></div>';
    }

    results.innerHTML += '<div style="margin-top:8px"><strong>Expected IDEA Darcula Colors Verification:</strong></div>';
    let allPass = true;
    const expectedChecks = [
        { name: 'Keywords should be ORANGE (#CC7832)', color: '#CC7832' },
        { name: 'Strings should be GREEN (#6A8759)', color: '#6A8759' },
        { name: 'Numbers should be BLUE (#6897BB)', color: '#6897BB' },
        { name: 'Comments should be GRAY (#808080)', color: '#808080' },
    ];
    expectedChecks.forEach(check => {
        const found = Object.values(tokenMap).some(t => t.color && t.color.toUpperCase() === check.color.toUpperCase());
        const status = found ? '<span class="pass">PASS</span>' : '<span class="fail">MISSING</span>';
        if (!found) allPass = false;
        results.innerHTML += '<div class="token-row"><span class="color-swatch" style="background:' + check.color + '"></span><span style="font-family:monospace;color:' + check.color + '">' + check.color + '</span><span style="flex:1">' + check.name + '</span>' + status + '</div>';
    });
    results.innerHTML += '<div style="margin-top:6px;font-weight:bold">' + (allPass ? '<span class="pass">All expected IDEA Darcula colors present!</span>' : '<span class="fail">Some colors may be missing - check token matching</span>') + '</div>';
}
</script>
</body>
</html>
